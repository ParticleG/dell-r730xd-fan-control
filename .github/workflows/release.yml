name: Build and release Debian package

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Run hardware-free tests
        run: python3 -B -m unittest -v
      - name: Install Debian build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential debhelper dpkg-dev
      - name: Build and inspect package
        shell: bash
        run: |
          set -euo pipefail
          version="$(dpkg-parsechangelog -S Version)"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            expected_tag="v${version%-*}"
            if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ || "$GITHUB_REF_NAME" != "$expected_tag" ]]; then
              echo "Release tag must be vX.Y.Z matching Debian version $version (expected $expected_tag)" >&2
              exit 1
            fi
          fi
          dpkg-buildpackage -b -us -uc
          package="../ipmi-fan-control_${version}_all.deb"
          test "$(dpkg-deb --field "$package" Package)" = ipmi-fan-control
          test "$(dpkg-deb --field "$package" Version)" = "$version"
          test "$(dpkg-deb --field "$package" Architecture)" = all
          mkdir -p dist "$RUNNER_TEMP/package"
          cp "$package" dist/
          dpkg-deb --extract "$package" "$RUNNER_TEMP/package"
          test -x "$RUNNER_TEMP/package/usr/bin/ipmi-fan-control"
          sudo apt-get install -y --no-install-recommends "$package"
          ipmi-fan-control --help
          ipmi-fan-control --list-profiles
          (cd dist && sha256sum ./*.deb > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: debian-package
          path: dist/
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: debian-package
          path: dist
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.deb dist/SHA256SUMS --verify-tag --generate-notes
